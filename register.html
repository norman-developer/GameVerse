<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>GameVerse: Регистрация</title>
    <link href="global.css" rel="stylesheet" />
    <link href="auth.css" rel="stylesheet" />
    <link href="https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css" rel="stylesheet" />
    <link href="https://cdn-uicons.flaticon.com/4.0.0/uicons-brands/css/uicons-brands.css" rel="stylesheet" />
    <link href="responsive.css" rel="stylesheet" />
    <link href="improvements.css" rel="stylesheet" />
    <link href="stage2.css" rel="stylesheet" />
</head>
<body>
    <header>
        <!-- Верхний хедер -->
        <a href="index.html">
            <img id="logo" src="logo.png" />
        </a>
        <nav>
            <a href="index.html">
                <i class="fi fi-rr-home"></i>
                Главная</a>
            <a href="library.html">
                <i class="fi fi-rr-books"></i>
                Библиотека</a>
            <a href="download.html">
                <i class="fi fi-rr-cloud-download-alt"></i>
                Загрузки</a>
            <a href="community.html">
                <i class="fi fi-rr-users-alt"></i>
                Сообщество</a>
        </nav>
        <!-- Нижний хедер -->
        <div class="social">
            <a href="https://t.me/share/url?url=https://capeducation.getcourse.ru" target="_blank">
                <i class="fi fi-rr-paper-plane"></i>
            </a>
            <a href="https://t.me/trsnbv_a">
                <i class="fi fi-brands-telegram"></i></a>
            <a href="https://github.com">
                <i class="fi fi-brands-github"></i>
            </a>
        </div>
    </header>
    <main>
        <section class="auth-wrap">
            <div class="auth-card">
                <div class="auth-banner">
                    <div class="auth-avatar"><i class="fi fi-rr-user"></i></div>
                    <h1>GameVerse ID</h1>
                    <p>Один аккаунт — целый мир игр</p>
                </div>
                <div class="auth-body">
                    <div class="auth-tabs"><a class="" href="login.html">Вход</a><a class="selected"
                            href="register.html">Регистрация</a></div>
                    <h2>Создать аккаунт</h2>
                    <p class="auth-note">Форма для будущей системы аккаунтов</p>
                    <form action="#" class="auth-form" method="post"><label for="username">Имя
                            пользователя</label><input autocomplete="username" id="username" minlength="3"
                            name="username" placeholder="Твой никнейм" required="" type="text" /><label
                            for="email">Электронная почта</label><input autocomplete="email" id="email" name="email"
                            placeholder="example@mail.com" required="" type="email" /><label
                            for="password">Пароль</label><input autocomplete="new-password" id="password" minlength="8"
                            name="password" placeholder="Не меньше 8 символов" required="" type="password" /><label
                            for="confirm">Повтори пароль</label><input autocomplete="new-password" id="confirm"
                            minlength="8" name="confirm" placeholder="Повтори пароль" required=""
                            type="password" /><button title="Авторизация появится позже"
                            type="button">Зарегистрироваться</button></form>
                    <p class="auth-switch"><a href="login.html">Уже есть аккаунт? Войти</a></p>
                </div>
            </div>
        </section>
        <footer class="site-footer">
            <div class="footer-bottom">© 2026 GameVerse • Все права защищены</div>
        </footer>
    </main>
    <nav aria-label="Мобильная навигация" class="mobile-nav"><a href="index.html"><i aria-hidden="true"
                class="fi fi-rr-home"></i><span>Главная</span></a><a href="library.html"><i aria-hidden="true"
                class="fi fi-rr-books"></i><span>Библиотека</span></a><a href="download.html"><i aria-hidden="true"
                class="fi fi-rr-download"></i><span>Загрузки</span></a><a href="community.html"><i aria-hidden="true"
                class="fi fi-rr-users-alt"></i><span>Сообщество</span></a><a href="profile.html"><i aria-hidden="true"
                class="fi fi-rr-user"></i><span>Профиль</span></a></nav>
</body>
</html>
